# =============================================================================
# TinyLLM Configuration
# =============================================================================
#
# Server listen address (use 0.0.0.0 inside containers; bind on host via docker-compose ports).
server:
  host: 0.0.0.0
  port: 4000

# ---------------------------------------------------------------------------
# Authentication — single shared API key (comma-separated for multiple keys).
# The value is read from the environment variable listed in `api_keys_env`.
# ---------------------------------------------------------------------------
auth:
  api_keys_env: TINYLLM_API_KEYS

# ---------------------------------------------------------------------------
# Routing behaviour
# ---------------------------------------------------------------------------
routing:
  # Seconds to exclude a provider+model after a fallback-eligible error.
  cooldown_seconds: 300
  # Maximum providers to try before giving up.
  max_attempts: 5

# ---------------------------------------------------------------------------
# Timeouts (seconds)
# ---------------------------------------------------------------------------
timeouts:
  connect_seconds: 30
  response_seconds: 120
  stream_idle_seconds: 180

# ---------------------------------------------------------------------------
# Provider definitions
#
# Each provider must have a unique name, type, base_url, and api_key_env
# pointing to the environment variable that holds its API key.
# Optional `headers` are merged into every request to that provider.
# ---------------------------------------------------------------------------
providers:
  opencode-zen:
    type: openai-compatible
    base_url: https://opencode.ai/zen/v1
    api_key_env: OPENCODE_ZEN_API_KEY

  openrouter:
    type: openai-compatible
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    headers:
      HTTP-Referer: https://llm.stpnk.tech
      X-Title: TinyLLM

  z-ai:
    type: openai-compatible
    base_url: https://api.z.ai/api/paas/v4
    api_key_env: ZAI_API_KEY

  orcarouter:
    type: openai-compatible
    base_url: https://api.orcarouter.ai/v1
    api_key_env: ORCAROUTER_API_KEY

# ---------------------------------------------------------------------------
# Route definitions
#
# Each named route is an ordered list of (provider, model) pairs.
# The proxy tries the first entry; on a fallback-eligible error it moves
# to the next, and so on.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# 
# ТОП-5 для кодинга
# 1	DeepSeek V4 Flash	8.5
# 2	North Mini Code	8.4
# 3	Laguna S 2.1	8.4
# 4	MiniMax M3	8.2
# 5	Muse Spark 1.2	8.0
# 
# ТОП-5 для агента
# 1	Laguna S 2.1	8.4
# 2	MiniMax M3	8.3
# 3	Muse Spark 1.2	8.2
# 4	DeepSeek V4 Flash	8.0
# 
# ---------------------------------------------------------------------------
routes:
  agent-auto:
    - provider: openrouter
      model: poolside/laguna-s-2.1:free
    - provider: openrouter
      model: minimax/minimax-m3:free
    - provider: opencode-zen
      model: muse-spark-1.2-contributor-free
    - provider: orcarouter
      model: deepseek/deepseek-v4-flash-free

  coding-auto:
    - provider: orcarouter
      model: deepseek/deepseek-v4-flash-free
    - provider: openrouter
      model: cohere/north-mini-code:free
    - provider: openrouter
      model: poolside/laguna-s-2.1:free
    - provider: openrouter
      model: minimax/minimax-m3:free
    - provider: opencode-zen
      model: muse-spark-1.2-contributor-free

  agent-auto-pay:
    - provider: openrouter
      model: poolside/laguna-s-2.1:free
    - provider: openrouter
      model: minimax/minimax-m3:free
    - provider: opencode-zen
      model: muse-spark-1.2-contributor-free
    - provider: orcarouter
      model: deepseek/deepseek-v4-flash-free

  coding-auto-pay:
    - provider: orcarouter
      model: deepseek/deepseek-v4-flash-free
    - provider: openrouter
      model: cohere/north-mini-code:free
    - provider: openrouter
      model: poolside/laguna-s-2.1:free
    - provider: openrouter
      model: minimax/minimax-m3:free
    - provider: opencode-zen
      model: muse-spark-1.2-contributor-free
    - provider: openrouter
      model: deepseek/deepseek-v4-flash-0731

  coding-deepseek:
    - provider: orcarouter
      model: deepseek/deepseek-v4-flash-free
