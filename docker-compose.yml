# =============================================================================
# docker-compose.yml — TinyLLM
# =============================================================================
# Usage:
#   docker compose up -d
#
# Override the env file or pass variables via shell:
#   docker compose --env-file .env.prod up -d
# =============================================================================

services:
  tinyllm:
    build: .
    container_name: tinyllm
    restart: unless-stopped
    ports:
      - "172.29.0.1:4100:4000"
    env_file:
      - .env
    volumes:
      # Mount config so it can be updated without rebuilding the image.
      - ./config.yaml:/app/config.yaml:ro
      - ./tinyllm.log:/app/tinyllm.log:rw
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket, urllib.request; s=socket.socket(); s.settimeout(8); s.connect(('127.0.0.1',4000)); s.close(); r=urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=8); assert r.status==200\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
